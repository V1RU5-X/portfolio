<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Farbod Tajik</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f14">
<link rel="icon" href="/portfolio/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --bg: #0b0f14; --surface: #121820; --ink: #e6edf3; --muted: #9aa7b4; --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.18); --accent: #5eead4; --on-accent: #0b0f14; --font-sans: Inter, system-ui, sans-serif; --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 var(--font-sans); }
main { width: min(100%, 36rem); }
.term { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; font-family: var(--font-mono); overflow: hidden; }
.term-bar { display: flex; align-items: center; gap: .4rem; padding: .7rem 1rem; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .8rem; }
.term-bar i { width: .55rem; height: .55rem; border-radius: 50%; border: 1px solid var(--line-strong); }
.term-bar span { margin-left: .6rem; color: var(--ink); }
.body { padding: 1.5rem; }
h1 { margin: 0 0 .75rem; font: 500 1.4rem/1.3 var(--font-mono); color: var(--accent); overflow-wrap: anywhere; }
p { margin: 0 0 1.5rem; color: var(--muted); font-family: var(--font-sans); }
a { display: inline-block; font: 500 .95rem var(--font-sans); text-decoration: none; padding: .75rem 1.5rem; border-radius: 6px; background: var(--accent); color: var(--on-accent); }
a:hover { filter: brightness(1.1); }
a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="term">
    <div class="term-bar"><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i><span>404.md</span></div>
    <div class="body">
      <h1>404: file not found</h1>
      <p>There is nothing at this address. It may have moved, or the link is wrong.</p>
      <a href="/portfolio/">Back to the homepage</a>
    </div>
  </div>
</main>
</body>
</html>
